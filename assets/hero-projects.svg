<svg width="1200" height="1550" viewBox="0 0 1200 1550" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RoSE Labs projects illustration</title>
  <desc id="desc">Abstract board with project tiles for Mhara, AlterEgo, Music4D and Ethic.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1100" y2="1470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.52" stop-color="#0B1830"/>
      <stop offset="1" stop-color="#050A13"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 220) rotate(45) scale(390 380)">
      <stop stop-color="#69A9FF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#69A9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(940 220) rotate(30) scale(340 320)">
      <stop stop-color="#00D0E6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#00D0E6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRose" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(610 1040) rotate(90) scale(440 420)">
