<svg width="1200" height="1550" viewBox="0 0 1200 1550" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RoSE Labs publications illustration</title>
  <desc id="desc">Abstract stack of scientific papers and article sheets.</desc>
  <defs>
    <linearGradient id="bg" x1="140" y1="120" x2="1080" y2="1450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070E1A"/>
      <stop offset="0.54" stop-color="#0B1A2D"/>
      <stop offset="1" stop-color="#050910"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 760) rotate(90) scale(490 490)">
      <stop stop-color="#D8ECFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#D8ECFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="paperGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(620 730) rotate(90) scale(260 260)">
